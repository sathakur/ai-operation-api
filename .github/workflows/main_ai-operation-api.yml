# Docs for Azure Web Apps Deploy:
# https://github.com/Azure/webapps-deploy

name: Build and deploy ASP.Net Core app to Azure Web App - ai-operation-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Clean
        run: dotnet clean AIInventory.Api.csproj --configuration Release

      - name: Restore dependencies
        run: dotnet restore AIInventory.Api.csproj

      - name: Build with dotnet
        run: dotnet build AIInventory.Api.csproj --configuration Release --no-restore

      - name: Publish Linux x64 app
        run: dotnet publish AIInventory.Api.csproj -c Release -r linux-x64 --self-contained false -o ${{ env.DOTNET_ROOT }}/myapp

      - name: List published files
        run: |
          echo "Published files:"
          find ${{ env.DOTNET_ROOT }}/myapp -maxdepth 2 -type f | sort

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: app-package

      - name: Verify deployment package
        run: |
          echo "Deployment package contents:"
          find app-package -maxdepth 2 -type f | sort

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ai-operation-api'
          slot-name: 'Production'
          package: app-package
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5EECFE6C08824CA582467C81E1B49471 }}